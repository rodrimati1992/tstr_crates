[package]
name = "tstr"
version = "0.2.4"
authors = ["rodrimati1992 <rodrimatt1985@gmail.com>"]
edition = "2024"
rust-version = "1.88.0"
license = "Zlib"
description = "Type-level strings"
readme="../readme.md"
documentation = "https://docs.rs/tstr"
keywords = []
categories = ["no-std"]
repository = "https://github.com/rodrimati1992/tstr_crates/"
include = [
    "Cargo.toml", 
    "src/**/*.rs", 
    "LICENSE-ZLIB.md", 
    "../readme.md", 
]

[features]
default = ["const_panic"]
str_generics = ["tstr_proc_macros/str_generics"]
nightly_str_generics = ["str_generics"]
const_panic = ["dep:const_panic"]

use_syn = ["tstr_proc_macros/syn_"]
for_examples = []

# private features
docsrs = []

[dependencies.const_panic]
version = "0.2.14"
features = ["rust_1_82"]
default-features = false
optional = true

[dev-dependencies.const_panic]
version = "0.2.14"
features = ["non_basic", "rust_1_82"]
default-features = false

[dependencies.typewit]
version = "1.12"
default-features = false

[dependencies.tstr_proc_macros]
version = "0.3.0"
path = "../tstr_proc_macros"

[package.metadata.docs.rs]
features = ["docsrs", "nightly_str_generics"]






