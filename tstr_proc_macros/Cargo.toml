[package]
name = "tstr_proc_macros"
version = "0.3.0"
authors = ["rodrimati1992 <rodrimatt1985@gmail.com>"]
edition = "2024"
rust-version = "1.88.0"
license = "Zlib"
description = "Implementation detail of tstr."
documentation = "https://docs.rs/tstr"
keywords = []
categories = ["no-std"]
repository = "https://github.com/rodrimati1992/tstr_crates/"
include = [
    "Cargo.toml", 
    "src/**/*.rs", 
    "LICENSE-ZLIB.md", 
]

[lib]
proc-macro = true

[features]
default = []
syn_ = ["syn", "proc_macro2_"]
proc_macro2_ = ["proc-macro2"]

str_generics = []

[dependencies]
proc-macro2 = {version = "1.0", optional = true}

[dependencies.syn]
version = "2.0.106"
default-features = false
features = ["parsing"]
optional = true
